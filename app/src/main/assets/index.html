<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FB7299">
<script>
(function(){
  try {
    var t = AndroidBridge.getThemeSync();
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch(e){
    try { var s = localStorage.getItem('theme'); if(s && s !== 'system') document.documentElement.setAttribute('data-theme', s); } catch(e2){}
  }
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <header id="titlebar">
    <div class="titlebar-left">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="2" y="3" width="20" height="18" rx="5" fill="#FB7299"/><text x="12" y="15.4" font-family="Arial, sans-serif" font-size="6.8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DDTV</text></svg>
      </div>
      <span class="title-text">DDTV <span class="tt-acc">直播录制</span></span>
    </div>
    <div class="titlebar-right">
      <button class="titlebar-btn" id="btnTheme" title="切换主题">
        <svg class="theme-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button class="titlebar-btn" id="btnSearchRoom" title="搜索UP添加直播间">
        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button class="titlebar-btn" id="btnAddRoom" title="添加房间">
        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M19 12.9h-6.1V19h-1.8v-6.1H5v-1.8h6.1V5h1.8v6.1H19z"/></svg>
      </button>
    </div>
  </header>

  <div id="content">

    <nav id="activitybar">
      <div class="activity-group">
        <button class="ab-btn active" data-view="explorer" title="直播监控">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 14H3V8h18v12zM9 10.5v7l6-3.5-6-3.5z"/></svg>
        </button>
        <button class="ab-btn" data-view="danmaku" title="弹幕">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 3H4a2 2 0 0 0-2 2v16l4-4h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM7 7.5h10v2H7v-2zm0 3.5h7v2H7v-2z"/></svg>
        </button>
        <button class="ab-btn" data-view="files" title="录制文件">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
        </button>
        <button class="ab-btn" data-view="data" title="数据统计">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 13h3.2v7H4v-7zm6.4-9h3.2v16h-3.2V4zm6.4 5H20v11h-3.2V9z"/></svg>
        </button>
        <button class="ab-btn" data-view="history" title="录制历史">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </button>
        <button class="ab-btn" data-view="tools" title="修复工具">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
        </button>
      </div>
      <div class="activity-group">
        <button class="ab-btn" data-view="account" title="账号">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>
        </button>
        <button class="ab-btn" data-view="settings" title="设置">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <button class="ab-btn" data-view="log" title="日志">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2.6 4.4L5.2 8.8 8.4 12l-3.2 3.2 1.4 1.4L11 12 6.6 7.4zM12 15v2h6v-2h-6z"/></svg>
        </button>
      </div>
    </nav>

    <aside id="sidebar">
      <div class="sidebar-header">
        <span id="sidebarTitle">直播监控</span>
        <span class="count" id="sidebarCount">0</span>
      </div>
      <div id="sidebarBody" class="sidebar-body"></div>
    </aside>

    <main id="editor">
      <div class="tabs" id="tabs"></div>
      <div id="editorBody" class="editor-body"></div>
    </main>

  </div>

  <footer id="statusbar">
    <div class="sb-left">
      <span class="sb-item"><i class="sb-dot" id="sbDot"></i><span id="sbRec">0 录制中</span></span>
      <span class="sb-sep"></span>
      <span class="sb-item" id="sbWatch">监控 0 房间</span>
      <span class="sb-sep"></span>
      <span class="sb-item" id="sbHeart"><svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> 挂机中</span>
      <span class="sb-sep"></span>
      <span class="sb-item" id="sbPoll">轮询 15s</span>
    </div>
    <span class="sb-right" id="sbRight">未登录 · v0.6.1</span>
  </footer>

</div>

<div id="toast" class="toast hidden"></div>

<!-- 通用模态框（自绘，替代原生 prompt/confirm） -->
<div id="modal" class="modal-mask hidden">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">提示</div>
    <div class="modal-msg" id="modalMsg"></div>
    <input type="text" id="modalInput" class="modal-input hidden-input" placeholder="" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-sec btn-sm" id="modalCancel">取消</button>
      <button class="btn btn-primary btn-sm" id="modalOk">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
